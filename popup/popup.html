
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Super Lemmy Settings</title>
    <link rel="stylesheet" href="popup.css">
    <script src="popup.js" defer></script>
</head>
<body>
    <header>
        <h1>Super Lemmy</h1>
        <span id="version"></span>
    </header>

    <main>
        <label for="theme">Theme</label>
        <select id="theme">
            <option value="original">Original Dark</option>
            <option value="lemmy">Follow Lemmy</option>
            <option value="light">Super Lemmy Light</option>
        </select>

        <p id="status" role="status"></p>
    </main>

    <footer>
        <a href="https://github.com/tangosox/Super-Lemmy"
           target="_blank" rel="noopener noreferrer">GitHub</a>
    </footer>
</body>
</html>
